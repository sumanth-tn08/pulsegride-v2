services:
  - type: web
    name: pulsegrid-v2-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: PYTHONPATH
        value: .
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VOICE_MODEL
        value: whisper-large-v3
      - key: TINYFISH_MCP_URL
        value: https://agent.tinyfish.ai/mcp
      - key: TAVILY_API_KEY
        sync: false
